}

function errMsg(m){
  hideOverlay();
  toast(m,"err",0);
}

var CATEGORY_DEFS = [
  { name: "Star Sports",       icon: "🏆", color: "#00B4D8",
    test: function(u){ return u.indexOf("STAR SPORTS") === 0 || u.indexOf("STARSPORTS") === 0; } },
  { name: "Star Movies/Serial", icon: "🎬", color: "#FF6B35",
    test: function(u){ return u.indexOf("STAR") === 0 || u.indexOf("JALSHA") !== -1; } },
  { name: "Sony",          icon: "🎥", color: "#1CA7EC",
    test: function(u){ return u.indexOf("SONY") === 0; } },
  { name: "Zee / United8", icon: "🔷", color: "#9B59B6",
    test: function(u){ return u.indexOf("ZEE") === 0 || u.indexOf("UNITED8") === 0 || u.indexOf("UNITED 8") === 0; } },
  { name: "Kids",          icon: "🧸", color: "#2ECC71",
    test: function(u){ return /KIDS?|CARTOON|HUNGAMA|POGO|NICK|DISNEY|SONIC|CHUTTI|BABY\s?TV|CBEEBIES/.test(u); } }
];
var OTHERS_DEF = { name: "Others", icon: "📡", color: "#E1306C" };
var ALL_DEF    = { name: "all",    icon: "🇮🇳", color: "#E1306C" };

function classify(name){
  var u = String(name || "").toUpperCase().trim();
  for(var i = 0; i < CATEGORY_DEFS.length; i++){
    if(CATEGORY_DEFS[i].test(u)) return CATEGORY_DEFS[i].name;
  }
  return OTHERS_DEF.name;
}

function catMeta(catName){
  for(var i = 0; i < CATEGORY_DEFS.length; i++){
    if(CATEGORY_DEFS[i].name === catName) return CATEGORY_DEFS[i];
  }
  return OTHERS_DEF;
}

function groupByCategory(chs){
  var buckets = {};
  chs.forEach(function(ch){
    var cat = classify(ch.name);
    if(!buckets[cat]) buckets[cat] = [];
    buckets[cat].push(ch);
  });
  var orderNames = CATEGORY_DEFS.map(function(d){ return d.name; }).concat([OTHERS_DEF.name]);
  var groups = [];
  orderNames.forEach(function(name){
    if(buckets[name] && buckets[name].length) groups.push({ name: name, channels: buckets[name] });
  });
  return groups;
}

var ALL_CHANNELS = [];
var ACTIVE_CAT   = "all";

function buildSelector(groups){
  var chips  = ['<button type="button" class="cat-chip' + (ACTIVE_CAT === "all" ? " active" : "") +
    '" data-cat="all" style="--chip-color:' + ALL_DEF.color + '">' + ALL_DEF.icon +
    ' <span>All Channels</span><span class="chip-count">' + ALL_CHANNELS.length + '</span></button>'];
  var opts   = ['<option value="all">' + ALL_DEF.icon + ' All Channels (' + ALL_CHANNELS.length + ')</option>'];

  groups.forEach(function(g){
    var meta = catMeta(g.name);
    chips.push(
      '<button type="button" class="cat-chip' + (ACTIVE_CAT === g.name ? " active" : "") +
      '" data-cat="' + g.name + '" style="--chip-color:' + meta.color + '">' + meta.icon +
      ' <span>' + g.name + '</span><span class="chip-count">' + g.channels.length + '</span></button>'
    );
    opts.push('<option value="' + g.name + '">' + meta.icon + ' ' + g.name + ' (' + g.channels.length + ')</option>');
  });

  $catChips.innerHTML  = chips.join("");
  $catSelect.innerHTML = opts.join("");
  $catSelect.value     = ACTIVE_CAT;

  Array.prototype.forEach.call($catChips.querySelectorAll(".cat-chip"), function(btn){
    btn.addEventListener("click", function(){
      ACTIVE_CAT = btn.getAttribute("data-cat");
      renderChannels();
    });
  });
  $catSelect.addEventListener("change", function(){
    ACTIVE_CAT = $catSelect.value;
    renderChannels();
  });
}

function renderChannels(){
  var groups = groupByCategory(ALL_CHANNELS);
  var shown  = ACTIVE_CAT === "all" ? groups : groups.filter(function(g){ return g.name === ACTIVE_CAT; });

  $grid.innerHTML = "";
  shown.forEach(function(g){
    var meta = catMeta(g.name);
    var section = document.createElement("div");
    section.className = "category-section";
    section.style.setProperty("--cat-color", meta.color);

    var header = document.createElement("div");
    header.className = "category-header";
    header.innerHTML =
      '<span class="category-icon">' + meta.icon + '</span>' +
      '<span class="category-title">' + g.name + '</span>' +
      '<span class="channel-count">' + g.channels.length + '</span>';
    section.appendChild(header);

    var grid = document.createElement("div");
    grid.className = "ch-grid";
    g.channels.forEach(function(ch){
      var a = document.createElement("a");
      a.href = "?id=" + encodeURIComponent(ch.id) + "&name=" + encodeURIComponent(ch.name);
      a.className = "ch-card";
      a.innerHTML = "<span>" + ch.name + "</span>";
      grid.appendChild(a);
    });
    section.appendChild(grid);

    $grid.appendChild(section);
  });

  Array.prototype.forEach.call($catChips.querySelectorAll(".cat-chip"), function(btn){
    btn.classList.toggle("active", btn.getAttribute("data-cat") === ACTIVE_CAT);
  });
  if($catSelect.value !== ACTIVE_CAT) $catSelect.value = ACTIVE_CAT;
}

function renderList(chs){
  ALL_CHANNELS = chs;
  var groups = groupByCategory(chs);
  buildSelector(groups);
  renderChannels();

  $list.style.display = "flex";
  hideOverlay();
}

function injectControls(pc, vid){
  if(!window.shaka || !window.shaka.ui) return false;
  try{
    var ui = new shaka.ui.Overlay(pc, vid);
    return !!ui;
  }catch(_){ return false; }
}

async function startPlayer(ch){
  $pc.style.display = "flex";
  var ui = new shaka.ui.Overlay($pc, $vid);
  var controls = ui.getControls();
  shaka.ui.Localization.DEFAULT_LOCALE = "en";

  ui.configure({
    controlPanelElements:[
      "play_pause",
      "mute",
      "volume",
      "spacer",
      "current_time",
      "time_and_duration",
      "spacer",
      "closed_captions",
      "quality","picture_in_picture","fullscreen"
    ],
    seekBarColors:{
      base:    "#444",
      buffered:"#FF9933",
      played:  "#138808"
    }
  });

  var _injectCount = 0;
  (function tryInject(){
    if(injectControls($pc, $vid)) return;
    if(++_injectCount < 5) setTimeout(tryInject, 150);
  })();

  var cookie = ch.cookie;
  var raw    = rawCookie(cookie);
  var keyId  = ch.key_id;
  var key    = ch.key;
  var url    = ch.stream_url;
  var restrictionsRelaxed = false;
  var thermalApplied      = false;
  var sessionStart        = Date.now();

  var thermalTimer = setInterval(function(){
    if(Date.now() - sessionStart < 60*60*1000) return;
    clearInterval(thermalTimer);
    if(thermalApplied) return;
    thermalApplied = true;
    try{
      player.configure("streaming.bufferBehind", 8);
      if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){
        player.configure("abr.restrictions.maxHeight", Math.min(PROF.maxH, 720));
      }
    }catch(_){}
  }, 60000);

  function buildCfg(){
    var effMaxH = (thermalApplied && /Android|iPhone|iPad|iPod/i.test(navigator.userAgent))
      ? Math.min(PROF.maxH, 720) : PROF.maxH;
    var restr = {};
    if(!restrictionsRelaxed){
      if(effMaxH < 1080) restr.maxHeight    = effMaxH;
      if(PROF.maxBw > 0) restr.maxBandwidth = PROF.maxBw;
    }
    return {
      drm:{ clearKeys:{ [keyId]:key } },
      manifest:{
        defaultPresentationDelay:4,
        ignoreTextStreamFailures:true,
        retryParameters:{maxAttempts:5,baseDelay:500,backoffFactor:2,fuzzFactor:.5,timeout:30000}
      },
      streaming:{
        lowLatencyMode:false,
        bufferingGoal:PROF.buf,
        rebufferingGoal:PROF.reBuf,
        bufferBehind:PROF.behind,
        safeSeekOffset:4,
        stallEnabled:true,
        stallThreshold:1,
        stallSkip:.3,
        inaccurateManifestTolerance:0,
        retryParameters:{maxAttempts:5,baseDelay:500,backoffFactor:2,fuzzFactor:.5,timeout:30000}
      },
      abr:{
        enabled:true,
        defaultBandwidthEstimate:PROF.bwEst,
        switchInterval:4,
        restrictions:restr
      }
    };
  }

  var player = ui.getPlayer();
  player.configure(buildCfg());

  var T = shaka.net.NetworkingEngine.RequestType;
  player.getNetworkingEngine().registerRequestFilter(function(type, req){
    req.headers["Referer"]    = "https://www.jiotv.com/";
    req.headers["User-Agent"] = "Mozilla/5.0 (Linux; Android 11; SM-G991B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36";
    req.headers["Cookie"]     = cookie;
    if(type === T.MANIFEST || type === T.SEGMENT)
      req.uris = req.uris.map(function(u){ return withCookie(u, raw); });
  });

  var refreshing = false;
  var retries    = 0;
  var edgeTried  = false;
  var lastTry    = 0;
  var started    = false;
  var stallTmr   = null;

  function unmuteOnce(){ $vid.muted = false; }
  $pc.addEventListener("pointerdown", unmuteOnce, {capture:true,once:true});
  $pc.addEventListener("click",       unmuteOnce, {capture:true,once:true});
  $pc.addEventListener("keydown",     unmuteOnce, {capture:true,once:true});

  function goLiveEdge(){
    if(refreshing) return;
    try{
      player.goToLive();
      edgeTried = true;
      toast("Syncing To Live Edge…","warn",2000);
    }catch(_){ reload(); }
  }

  async function reload(){
    var now = Date.now();
    if(refreshing || now - lastTry < 1500) return;
    if(retries >= 5){ toast("Stream Unavailable. Please Try Again Later.","err",0); return; }
    refreshing = true; lastTry = now; retries++;
    toast("Reconnecting… (" + retries + " / 5)","warn",0);
    try{
      var d     = await loadData();
      var fresh = d.channels.find(function(c){ return c.id === ch.id; });
      if(!fresh) throw new Error("missing");
      cookie = fresh.cookie; raw   = rawCookie(cookie);
      keyId  = fresh.key_id; key   = fresh.key; url = fresh.stream_url;
      player.configure(buildCfg());
      await player.load(url);
      $vid.play().catch(function(){});
      retries = 0; edgeTried = false;
      toast("🇮🇳 Live","live",4000);
    }catch(_){
      setTimeout(reload, Math.min(1000 * Math.pow(2, retries - 1), 8000));
    }finally{ refreshing = false; }
  }

  var RECOVERABLE = [1001,1002,1003,4012,6006,6007,7000,7001,7002];

  player.addEventListener("error", function(ev){
    var err  = ev.detail;
    var code = err && err.code;
    if(code === 4014 && !restrictionsRelaxed){
      restrictionsRelaxed = true;
      refreshing = true;
      player.configure(buildCfg());
      toast("Adjusting Quality…","warn",2000);
      player.load(url)
        .then(function(){ $vid.play().catch(function(){}); toast("🇮🇳 Live","live",4000); })
        .catch(function(){ reload(); })
        .finally(function(){ refreshing = false; });
      return;
    }
    if(RECOVERABLE.indexOf(code) !== -1){
      toast("Buffering…","warn",0);
      setTimeout(function(){ if(!refreshing) reload(); }, 700);
    } else {
      toast("Error • Retrying…","err",6000);
    }
  });

  try{
    setMsg("Loading Stream…");
    toast("Loading Stream…","warn",0);
    await player.load(url);
    hideOverlay();
    toast("Ready — Tap ▶ To Play","ok",5000);
  }catch(_){
    hideOverlay();
    toast("Connection Error — Retrying…","warn",0);
    setTimeout(reload, 1500);
    return;
  }

  function onStall(){
    if(stallTmr) return;
    toast("Buffering…","warn",0);
    if(!started || refreshing) return;
    stallTmr = setTimeout(function(){
      stallTmr = null;
      if(!edgeTried) goLiveEdge(); else reload();
    }, 5000);
  }

  function onPlaying(){
    started = true;
    if(stallTmr){ clearTimeout(stallTmr); stallTmr = null; }
    edgeTried = false;
    if(!refreshing) toast("🇮🇳 Live","live",3000);
  }

  $vid.addEventListener("waiting", onStall);
  $vid.addEventListener("stalled", onStall);
  $vid.addEventListener("playing", onPlaying);
  $vid.addEventListener("error",   function(){
    if(!refreshing){
      toast("Buffering…","warn",0);
      setTimeout(function(){ if(!refreshing) reload(); }, 700);
    }
  });

  document.addEventListener("visibilitychange", function(){
    if(!document.hidden){
      setTimeout(function(){
        if(started && $vid.paused && !refreshing) $vid.play().catch(function(){});
      }, 400);
    }
  });

  var netConn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  if(netConn){
    netConn.addEventListener("change", function(){
      if(!player || restrictionsRelaxed) return;
      var t = netConn.effectiveType || "4g";
      var h = t === "slow-2g" || t === "2g" ? 240 : t === "3g" ? 480 : PROF.maxH;
      try{ player.configure("abr.restrictions.maxHeight", h); }catch(_){}
      if(h < PROF.maxH) toast("Slow Network — Reducing Quality","warn",3000);
    });
  }
}

async function main(){
  var id = getChId(), data;

  if(id && $loadBrand){
    var qName = getChName();
    $loadBrand.textContent = qName ? "Loading " + qName : "Loading…";
  }

  try{
    setMsg("Fetching Channels…");
    data = await loadData();
  }catch(_){
    errMsg("Connection Error. Please Check Your Internet.");
    return;
  }
  if(!id){ renderList(data.channels); return; }
  var ch = data.channels.find(function(c){ return c.id === id; });
  if(!ch){ errMsg("Channel Not Found."); return; }
  if($loadBrand) $loadBrand.textContent = "Loading " + ch.name;
  document.title = ch.name + " • Rishi TV Engine";
  await startPlayer(ch);
}

document.addEventListener("DOMContentLoaded", main);
})();
</script>
